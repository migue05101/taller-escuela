async function open_(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  for(const k of D.k){try{const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(k.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pl=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(k.i)},kek,b64(k.d)));const role=new TextDecoder().decode(pl.slice(32));
    const cek=await crypto.subtle.importKey('raw',pl.slice(0,32),'AES-GCM',false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},cek,b64(D.d));
    return {role,html:new TextDecoder().decode(pt)};}catch(e){}}return null;}
function show(r){let inj='<script>window.__TE_ROLE='+JSON.stringify(r.role)+';';
  if(r.role==='invitado')inj+='document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("keydown",e=>{const k=(e.key||"").toLowerCase();if(k==="f12"||((e.ctrlKey||e.metaKey)&&(k==="u"||k==="s"||(e.shiftKey&&(k==="i"||k==="j"||k==="c")))))e.preventDefault();},true);document.addEventListener("selectstart",e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault();});';
  inj+='<\/script>';const m=/^\s*<!doctype[^>]*>/i.exec(r.html);const h=m?m[0]+inj+r.html.slice(m[0].length):inj+r.html;document.open();document.write(h);document.close();}

  if(!h){go.disabled=false;e.textContent='Contraseña incorrecta.';pw.select();return;}
  try{if(document.getElementById('rm').checked){localStorage.setItem('te-gate',pw.value);}else localStorage.removeItem('te-gate');}catch(_){}
  show(h);});
